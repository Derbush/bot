name: Visa Appointment Bot - Every 20 Minutes

on:
  schedule:
    # Run every 20 minutes
    - cron: '*/20 * * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  issues: write


jobs:

  # ============================================================
  # SEARCH FOR AVAILABLE VISA DATES
  # ============================================================
  search_dates:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      test_result: ${{ steps.search.outputs.test_result }}
      last_month: ${{ steps.capture_dates.outputs.month }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # NODE
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*


      # ----------------------------------------------------------
      # PLAYWRIGHT CACHE
      # ----------------------------------------------------------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-


      # ----------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # ----------------------------------------------------------
      # INSTALL PLAYWRIGHT
      # ----------------------------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps


      # ==========================================================
      # RUN SEARCH TEST
      #
      # IMPORTANT:
      # Search test is allowed to fail because a failed search
      # means that no dates were found.
      #
      # The JOB itself stays successful.
      # ==========================================================
      - name: Run "Поиск мест 2026" test
        id: search
        shell: bash
        run: |

          echo "============================================"
          echo "SEARCHING FOR VISA DATES"
          echo "============================================"

          set +e

          npx playwright test \
            --grep "Поиск мест 2026" \
            --retries=0 \
            2>&1 | tee test-output.txt

          # IMPORTANT:
          # Because Playwright output is piped through tee,
          # $? would contain tee's exit code.
          #
          # PIPESTATUS[0] contains Playwright's real exit code.
          TEST_RESULT=${PIPESTATUS[0]}

          echo ""
          echo "============================================"
          echo "PLAYWRIGHT EXIT CODE: $TEST_RESULT"
          echo "============================================"

          if [ "$TEST_RESULT" -eq 0 ]; then

            echo "test_result=success" >> "$GITHUB_OUTPUT"

            echo ""
            echo "============================================"
            echo "✅ VISA DATES FOUND"
            echo "============================================"

          else

            echo "test_result=failure" >> "$GITHUB_OUTPUT"

            echo ""
            echo "============================================"
            echo "ℹ️ NO VISA DATES FOUND"
            echo "============================================"

            echo "The search test did not pass."
            echo "This is treated as 'no dates available'."
            echo "The workflow will continue successfully."
            echo "The booking test will NOT run."

          fi

          # VERY IMPORTANT:
          # Do NOT exit 1 here.
          #
          # A failed search is not a CI/build failure.
          # It means that no appointment dates were found.
          exit 0

        env:
          VISAWEBSITE: ${{ secrets.VISAWEBSITE }}
          VISALOGIN: ${{ secrets.VISALOGIN }}
          VISAPASSWORD: ${{ secrets.VISAPASSWORD }}


      # ==========================================================
      # CAPTURE MONTH / DATES FROM OUTPUT
      # ==========================================================
      - name: Capture dates and month from output
        id: capture_dates
        if: always()
        shell: bash
        run: |

          if [ -f test-output.txt ]; then

            MONTH=$(grep "Navigating:" test-output.txt | tail -1 || true)

            if [ -z "$MONTH" ]; then
              MONTH="unknown"
            fi

          else

            MONTH="unknown"

          fi

          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

          echo ""
          echo "============================================"
          echo "LAST MONTH CHECKED"
          echo "============================================"
          echo "$MONTH"


      # ==========================================================
      # PRINT COMPLETE TEST OUTPUT TO GITHUB LOG
      # ==========================================================
      - name: Display search test output
        if: always()
        shell: bash
        run: |

          echo ""
          echo "============================================"
          echo "COMPLETE SEARCH TEST OUTPUT"
          echo "============================================"

          if [ -f test-output.txt ]; then
            cat test-output.txt
          else
            echo "test-output.txt does not exist."
          fi


      # ==========================================================
      # UPLOAD SEARCH REPORT
      # ==========================================================
      - name: Upload search test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-test-report
          path: |
            playwright-report/
            test-output.txt
            test-results/
          if-no-files-found: warn
          retention-days: 7


  # ============================================================
  # NOTIFY SEARCH RESULT
  #
  # This runs whether dates were found or not.
  # ============================================================
  notify_search_result:
    runs-on: ubuntu-latest

    needs:
      - search_dates

    if: always()

    permissions:
      issues: write

    steps:

      - name: Create GitHub Issue with search result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |

          if [ "${{ needs.search_dates.outputs.test_result }}" = "success" ]; then

            TITLE="🚨 VISA DATES AVAILABLE - Поиск мест 2026"

            STATUS="✅ PASSED"

            RESULT_TEXT="Visa appointment dates were found. The booking test will now run."

          else

            TITLE="ℹ️ NO VISA DATES - Поиск мест 2026"

            STATUS="ℹ️ NO DATES FOUND"

            RESULT_TEXT="No available visa dates were found. The booking test will NOT run."

          fi


          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$(cat <<EOF

          ============================================
          VISA DATE SEARCH RESULT
          ============================================

          Test:
          "Поиск мест 2026"

          Status:
          $STATUS

          ============================================
          RESULT
          ============================================

          $RESULT_TEXT

          Last Month Checked:
          ${{ needs.search_dates.outputs.last_month }}

          ============================================
          GITHUB ACTION RUN
          ============================================

          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ============================================
          FULL TEST RESULTS
          ============================================

          The complete Playwright report and console output
          are available in the:

          search-test-report

          artifact.

          ============================================
          HOW TO VIEW RESULTS
          ============================================

          1. Open the GitHub Actions run.
          2. Find "search-test-report".
          3. Download the ZIP.
          4. Extract the ZIP.
          5. Open index.html.

          EOF
          )"


  # ============================================================
  # BOOK APPOINTMENT
  #
  # ONLY RUNS IF SEARCH PASSED.
  #
  # --retries=0 guarantees the test runs ONLY ONCE.
  # ============================================================
  book_appointment:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    needs:
      - search_dates

    if: |
      needs.search_dates.outputs.test_result == 'success'

    outputs:
      test_result: ${{ steps.booking.outputs.test_result }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # NODE
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*


      # ----------------------------------------------------------
      # PLAYWRIGHT CACHE
      # ----------------------------------------------------------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-


      # ----------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # ----------------------------------------------------------
      # INSTALL PLAYWRIGHT
      # ----------------------------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps


      # ==========================================================
      # RUN BOOKING TEST EXACTLY ONCE
      #
      # IMPORTANT:
      # --retries=0 disables Playwright retries.
      # ==========================================================
      - name: Run "Запись" test
        id: booking
        continue-on-error: true
        shell: bash
        run: |

          echo "============================================"
          echo "BOOKING APPOINTMENT"
          echo "============================================"

          set +e

          npx playwright test \
            --grep "Запись" \
            --retries=0 \
            2>&1 | tee booking-output.txt

          # Get Playwright's actual exit code.
          TEST_RESULT=${PIPESTATUS[0]}

          echo ""
          echo "============================================"
          echo "PLAYWRIGHT BOOKING EXIT CODE: $TEST_RESULT"
          echo "============================================"

          if [ "$TEST_RESULT" -eq 0 ]; then

            echo "test_result=success" >> "$GITHUB_OUTPUT"

            echo ""
            echo "============================================"
            echo "🚨 APPOINTMENT BOOKING SUCCESS"
            echo "============================================"

          else

            echo "test_result=failure" >> "$GITHUB_OUTPUT"

            echo ""
            echo "============================================"
            echo "❌ APPOINTMENT BOOKING FAILED"
            echo "============================================"

          fi


      # ==========================================================
      # DISPLAY COMPLETE BOOKING OUTPUT
      # ==========================================================
      - name: Display booking test output
        if: always()
        shell: bash
        run: |

          echo ""
          echo "============================================"
          echo "COMPLETE BOOKING TEST OUTPUT"
          echo "============================================"

          if [ -f booking-output.txt ]; then
            cat booking-output.txt
          else
            echo "booking-output.txt does not exist."
          fi


      # ==========================================================
      # UPLOAD BOOKING REPORT
      # ==========================================================
      - name: Upload booking test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-test-report
          path: |
            playwright-report/
            booking-output.txt
            test-results/
          if-no-files-found: warn
          retention-days: 7


      # ==========================================================
      # FAIL BOOKING JOB IF BOOKING TEST FAILED
      #
      # THIS IS THE ONLY PLACE WHERE WE INTENTIONALLY
      # FAIL THE BUILD.
      # ==========================================================
      - name: Fail build if "Запись" failed
        if: steps.booking.outputs.test_result == 'failure'
        shell: bash
        run: |

          echo "============================================"
          echo "❌ BOOKING TEST FAILED"
          echo "============================================"

          echo "The appointment booking test failed."
          echo "The GitHub Actions build will be marked as FAILED."

          exit 1


  # ============================================================
  # NOTIFY BOOKING RESULT
  #
  # This runs AFTER "Запись" whether it PASSES or FAILS.
  #
  # If it fails, this sends a FAILURE notification.
  # It NEVER says the appointment was booked when the test failed.
  # ============================================================
  notify_booking_result:
    runs-on: ubuntu-latest

    needs:
      - search_dates
      - book_appointment

    if: always()

    permissions:
      issues: write

    steps:

      - name: Create GitHub Issue with booking result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |

          if [ "${{ needs.book_appointment.outputs.test_result }}" = "success" ]; then

            TITLE="🚨 APPOINTMENT BOOKED - Запись PASSED"

            STATUS="✅ PASSED"

            RESULT_TEXT="The appointment booking test completed successfully. The appointment should be booked."

          else

            TITLE="❌ APPOINTMENT BOOKING FAILED - Запись"

            STATUS="❌ FAILED"

            RESULT_TEXT="The appointment booking test failed. The GitHub Actions build has been marked as FAILED."

          fi


          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$(cat <<EOF

          ============================================
          APPOINTMENT BOOKING RESULT
          ============================================

          Test:
          "Запись"

          Status:
          $STATUS

          ============================================
          RESULT
          ============================================

          $RESULT_TEXT

          ============================================
          GITHUB ACTION RUN
          ============================================

          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ============================================
          FULL TEST RESULTS
          ============================================

          The complete Playwright report and console output
          are available in:

          booking-test-report

          artifact.

          ============================================
          HOW TO VIEW RESULTS
          ============================================

          1. Open the GitHub Actions run.
          2. Find "booking-test-report".
          3. Download the ZIP.
          4. Extract the ZIP.
          5. Open index.html.

          EOF
          )"
