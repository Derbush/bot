name: Visa Appointment Bot - Every 20 Minutes

on:
  schedule:
    # Run every 20 minutes
    - cron: '*/20 * * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:

  # ============================================================
  # SEARCH FOR AVAILABLE DATES
  # ============================================================
  search_dates:
    timeout-minutes: 120
    runs-on: ubuntu-latest

    outputs:
      dates_found: ${{ steps.search.outputs.dates_found }}
      last_month: ${{ steps.capture_dates.outputs.month }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run "Поиск мест 2026" test
        id: search
        continue-on-error: true
        shell: bash
        run: |
          set +e

          npx playwright test --grep "Поиск мест 2026" 2>&1 | tee test-output.txt

          TEST_RESULT=${PIPESTATUS[0]}

          echo "Playwright exit code: $TEST_RESULT"

          if [ "$TEST_RESULT" -eq 0 ]; then
            echo "dates_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "dates_found=false" >> "$GITHUB_OUTPUT"
          fi

          # Do NOT fail this step yet.
          # We want notification/booking jobs to run first.
          exit 0

        env:
          VISAWEBSITE: ${{ secrets.VISAWEBSITE }}
          VISALOGIN: ${{ secrets.VISALOGIN }}
          VISAPASSWORD: ${{ secrets.VISAPASSWORD }}

      - name: Capture dates and month from output
        id: capture_dates
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          MONTH=$(grep "Navigating:" test-output.txt | tail -1 || true)

          if [ -z "$MONTH" ]; then
            MONTH="unknown"
          fi

          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: search-test-report
          path: playwright-report/
          retention-days: 7


  # ============================================================
  # NOTIFY THAT DATES WERE FOUND
  # ============================================================
  notify_dates_found:
    runs-on: ubuntu-latest
    needs: search_dates

    if: ${{ !cancelled() && needs.search_dates.outputs.dates_found == 'true' }}

    permissions:
      issues: write

    steps:
      - name: Create GitHub Issue - Dates Found
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 VISA DATES AVAILABLE! - Поиск мест 2026 PASSED" \
            --body "$(cat <<'EOF'
          🚨 VISA DATES FOUND

          ============================================
          AVAILABLE DATES FOUND
          ============================================

          Test Name: "Поиск мест 2026"
          Status: ✅ PASSED

          Last Month Checked:
          ${{ needs.search_dates.outputs.last_month }}

          📊 VIEW FULL DETAILS:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ⬇️ HOW TO VIEW DATES:

          1. Click the GitHub Run link above
          2. Click on "search-test-report"
          3. Download the ZIP file
          4. Extract it
          5. Open index.html
          6. Expand the test steps to see the dates found

          🤖 Next: Booking test "Запись" will run.
          EOF
          )"


  # ============================================================
  # BOOK APPOINTMENT
  # ============================================================
  book_appointment:
    timeout-minutes: 120
    needs:
      - search_dates

    if: ${{ !cancelled() && needs.search_dates.outputs.dates_found == 'true' }}

    runs-on: ubuntu-latest

    outputs:
      booking_found: ${{ steps.booking.outputs.booking_found }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run "Запись" test
        id: booking
        continue-on-error: true
        shell: bash
        run: |
          set +e

          npx playwright test --grep "Запись" 2>&1 | tee booking-output.txt

          TEST_RESULT=${PIPESTATUS[0]}

          echo "Playwright booking exit code: $TEST_RESULT"

          if [ "$TEST_RESULT" -eq 0 ]; then
            echo "booking_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "booking_found=false" >> "$GITHUB_OUTPUT"
          fi

          # Do not fail yet.
          # Notification must happen first.
          exit 0

        env:
          VISAWEBSITE: ${{ secrets.VISAWEBSITE }}
          VISALOGIN: ${{ secrets.VISALOGIN }}
          VISAPASSWORD: ${{ secrets.VISAPASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: booking-test-report
          path: playwright-report/
          retention-days: 7


  # ============================================================
  # NOTIFY BOOKING SUCCESS
  # ============================================================
  notify_booking_success:
    runs-on: ubuntu-latest

    needs:
      - search_dates
      - book_appointment

    if: ${{ !cancelled() && needs.book_appointment.outputs.booking_found == 'true' }}

    permissions:
      issues: write

    steps:
      - name: Create GitHub Issue - Booking Success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 APPOINTMENT BOOKED! - Запись PASSED" \
            --body "$(cat <<'EOF'
          🚨 APPOINTMENT SUCCESSFULLY BOOKED

          ============================================
          BOOKING SUCCESS
          ============================================

          Test Name: "Запись"
          Status: ✅ PASSED

          📊 VIEW FULL DETAILS:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ⬇️ HOW TO VIEW BOOKING DETAILS:

          1. Click the GitHub Run link above
          2. Click on "booking-test-report"
          3. Download the ZIP file
          4. Extract it
          5. Open index.html
          6. Expand the test steps to see the booking details
          EOF
          )"


  # ============================================================
  # INTENTIONALLY FAIL WORKFLOW WHEN SOMETHING IMPORTANT HAPPENS
  # ============================================================
  mark_workflow_failed:
    runs-on: ubuntu-latest

    needs:
      - search_dates
      - book_appointment
      - notify_dates_found
      - notify_booking_success

    if: |
      always() &&
      (
        needs.search_dates.outputs.dates_found == 'true' ||
        needs.book_appointment.outputs.booking_found == 'true'
      )

    steps:
      - name: Mark workflow as FAILED because appointment event occurred
        run: |
          echo "🚨 IMPORTANT EVENT DETECTED"
          echo ""
          echo "The Playwright test passed because:"
          echo "  - Visa dates were found and/or"
          echo "  - Appointment was booked"
          echo ""
          echo "Intentionally failing this workflow so GitHub sends a failed-workflow notification."

          exit 1
```
