name: Visa Appointment Bot - Every 20 Minutes

on:
  schedule:
    # Run every 20 minutes
    - cron: '*/20 * * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  issues: write


jobs:

  # ============================================================
  # 1. SEARCH FOR VISA DATES
  # ============================================================
  search_dates:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      test_result: ${{ steps.search.outputs.test_result }}
      last_month: ${{ steps.capture_dates.outputs.month }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ----------------------------------------------------------
      # RUN SEARCH TEST
      # ----------------------------------------------------------
      - name: Run "Поиск мест 2026" test
        id: search
        continue-on-error: true
        shell: bash
        run: |
          echo "============================================"
          echo "Running: Поиск мест 2026"
          echo "============================================"

          set +e

          npx playwright test \
            --grep "Поиск мест 2026" \
            --retries=0 \
            2>&1 | tee test-output.txt

          TEST_RESULT=${PIPESTATUS[0]}

          echo ""
          echo "Playwright exit code: $TEST_RESULT"

          if [ "$TEST_RESULT" -eq 0 ]; then
            echo "test_result=success" >> "$GITHUB_OUTPUT"
            echo "SEARCH_RESULT=success" >> "$GITHUB_ENV"
            echo "✅ Search test PASSED"
          else
            echo "test_result=failure" >> "$GITHUB_OUTPUT"
            echo "SEARCH_RESULT=failure" >> "$GITHUB_ENV"
            echo "❌ Search test FAILED"
          fi

      # ----------------------------------------------------------
      # CAPTURE OUTPUT / DATES
      # ----------------------------------------------------------
      - name: Capture dates and month from output
        id: capture_dates
        if: always()
        shell: bash
        run: |
          if [ -f test-output.txt ]; then

            MONTH=$(grep "Navigating:" test-output.txt | tail -1 || true)

            if [ -z "$MONTH" ]; then
              MONTH="unknown"
            fi

            echo "month=$MONTH" >> "$GITHUB_OUTPUT"

            echo ""
            echo "============================================"
            echo "LAST MONTH CHECKED"
            echo "============================================"
            echo "$MONTH"

            echo ""
            echo "============================================"
            echo "TEST OUTPUT"
            echo "============================================"
            cat test-output.txt

          else
            echo "month=unknown" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------
      # UPLOAD SEARCH REPORT
      # ----------------------------------------------------------
      - name: Upload search test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-test-report
          path: |
            playwright-report/
            test-output.txt
            test-results/
          if-no-files-found: warn
          retention-days: 7

      # ----------------------------------------------------------
      # FAIL SEARCH JOB IF TEST FAILED
      # ----------------------------------------------------------
      - name: Fail search job if test failed
        if: steps.search.outputs.test_result == 'failure'
        shell: bash
        run: |
          echo "❌ 'Поиск мест 2026' failed."
          echo "The workflow will be marked as FAILED."
          exit 1


  # ============================================================
  # 2. SEND SEARCH TEST RESULTS
  #
  # Runs after search regardless of whether search passed/failed.
  # ============================================================
  notify_search_result:
    runs-on: ubuntu-latest

    needs:
      - search_dates

    if: always()

    permissions:
      issues: write

    steps:

      - name: Create GitHub Issue - Search Test Result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |

          if [ "${{ needs.search_dates.outputs.test_result }}" = "success" ]; then

            TITLE="✅ VISA DATES AVAILABLE! - Поиск мест 2026 PASSED"

            STATUS="✅ PASSED"

            MESSAGE="Visa dates were found. The booking test will now run."

          else

            TITLE="❌ VISA SEARCH TEST FAILED - Поиск мест 2026"

            STATUS="❌ FAILED"

            MESSAGE="The visa search test failed. The booking test will NOT run."

          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$(cat <<EOF
          ============================================
          VISA SEARCH TEST RESULT
          ============================================

          Test:
          "Поиск мест 2026"

          Status:
          $STATUS

          Last Month Checked:
          ${{ needs.search_dates.outputs.last_month }}

          ============================================
          RESULT
          ============================================

          $MESSAGE

          ============================================
          GITHUB ACTION RUN
          ============================================

          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ============================================
          HOW TO VIEW THE FULL TEST RESULTS
          ============================================

          1. Open the GitHub Actions run above.
          2. Open the "search-test-report" artifact.
          3. Download the ZIP.
          4. Extract it.
          5. Open index.html for the Playwright report.

          ============================================
          TEST OUTPUT
          ============================================

          The complete Playwright output is available
          in the "search-test-report" artifact.

          EOF
          )"


  # ============================================================
  # 3. BOOK APPOINTMENT
  #
  # ONLY runs if search test PASSED.
  # ============================================================
  book_appointment:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    needs:
      - search_dates

    if: |
      needs.search_dates.result == 'success' &&
      needs.search_dates.outputs.test_result == 'success'

    outputs:
      test_result: ${{ steps.booking.outputs.test_result }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ----------------------------------------------------------
      # RUN BOOKING TEST EXACTLY ONCE
      # ----------------------------------------------------------
      - name: Run "Запись" test
        id: booking
        continue-on-error: true
        shell: bash
        run: |

          echo "============================================"
          echo "Running: Запись"
          echo "============================================"

          set +e

          npx playwright test \
            --grep "Запись" \
            --retries=0 \
            2>&1 | tee booking-output.txt

          TEST_RESULT=${PIPESTATUS[0]}

          echo ""
          echo "Playwright booking exit code: $TEST_RESULT"

          if [ "$TEST_RESULT" -eq 0 ]; then
            echo "test_result=success" >> "$GITHUB_OUTPUT"
            echo "✅ Booking test PASSED"
          else
            echo "test_result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ Booking test FAILED"
          fi

      # ----------------------------------------------------------
      # PRINT BOOKING OUTPUT
      # ----------------------------------------------------------
      - name: Display booking test results
        if: always()
        shell: bash
        run: |

          echo "============================================"
          echo "BOOKING TEST OUTPUT"
          echo "============================================"

          if [ -f booking-output.txt ]; then
            cat booking-output.txt
          else
            echo "booking-output.txt was not created."
          fi

      # ----------------------------------------------------------
      # UPLOAD BOOKING REPORT
      # ----------------------------------------------------------
      - name: Upload booking test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-test-report
          path: |
            playwright-report/
            booking-output.txt
            test-results/
          if-no-files-found: warn
          retention-days: 7

      # ----------------------------------------------------------
      # FAIL BOOKING JOB IF TEST FAILED
      # ----------------------------------------------------------
      - name: Fail booking job if test failed
        if: steps.booking.outputs.test_result == 'failure'
        shell: bash
        run: |
          echo "❌ 'Запись' test failed."
          echo "The workflow will be marked as FAILED."
          exit 1


  # ============================================================
  # 4. SEND BOOKING RESULT
  #
  # This runs AFTER "Запись" whether it passed or failed.
  # ============================================================
  notify_booking_result:
    runs-on: ubuntu-latest

    needs:
      - book_appointment

    if: always()

    permissions:
      issues: write

    steps:

      - name: Create GitHub Issue - Booking Test Result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |

          if [ "${{ needs.book_appointment.outputs.test_result }}" = "success" ]; then

            TITLE="🚨 APPOINTMENT BOOKED! - Запись PASSED"

            STATUS="✅ PASSED"

            MESSAGE="The appointment booking test completed successfully."

          else

            TITLE="❌ APPOINTMENT BOOKING FAILED - Запись"

            STATUS="❌ FAILED"

            MESSAGE="The appointment booking test failed. No booking success notification was sent."

          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$(cat <<EOF
          ============================================
          APPOINTMENT BOOKING TEST RESULT
          ============================================

          Test:
          "Запись"

          Status:
          $STATUS

          ============================================
          RESULT
          ============================================

          $MESSAGE

          ============================================
          GITHUB ACTION RUN
          ============================================

          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ============================================
          HOW TO VIEW THE FULL TEST RESULTS
          ============================================

          1. Open the GitHub Actions run above.
          2. Open the "booking-test-report" artifact.
          3. Download the ZIP.
          4. Extract it.
          5. Open index.html for the Playwright report.

          ============================================
          TEST OUTPUT
          ============================================

          The complete Playwright output is available
          in the "booking-test-report" artifact.

          EOF
          )"
